# Server configuration
server.port=8083

# Service discovery configuration
surah.service.url=${SURAH_SERVICE_URL:http://surah-service:8081}
ayah.service.url=${AYAH_SERVICE_URL:http://ayah-service:8082}
api.gateway.url=${API_GATEWAY_URL:http://api-gateway:8080}

# Thymeleaf configuration
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Static resources
spring.resources.cache.period=86400
spring.resources.chain.enabled=true

# Logging configuration for Docker
logging.level.root=INFO
logging.level.com.baraka=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Actuator endpoints for health checks
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always 