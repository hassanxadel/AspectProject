<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran Search Service</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="/css/quran-search.css">
    <style>
        body {
            background-color: #f7f0dc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-image: none;
        }
        
        .islamic-pattern {
            position: fixed;
            height: 100%;
            width: 180px;
            background-image: url('/assets/images/sides.png');
            background-repeat: repeat-y;
            z-index: -1;
        }
        
        .islamic-pattern-left {
            left: 32px;
        }
        
        .islamic-pattern-right {
            right: -30px;
        }
        
        .main-container {
            min-height: calc(100vh - 150px);
            padding-top: 50px;
        }
        
        .search-wrapper {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .search-title {
            color: #2d6a4f;
            text-align: center;
            margin-bottom: 25px;
            font-weight: 600;
            font-size: 32px;
        }
        
        .nav-container {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }
        
        .top-navbar {
            background-color: white;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 5px 20px;
            display: inline-flex;
            margin: 0 auto;
        }
        
        .top-navbar .nav-item {
            margin: 0 10px;
        }
        
        .top-navbar .nav-link {
            color: #2d6a4f !important;
            font-weight: 500;
            padding: 10px 15px;
            border-radius: 20px;
            transition: all 0.3s;
        }
        
        .top-navbar .nav-link:hover {
            background-color: rgba(45, 106, 79, 0.1);
        }
        
        .top-navbar .nav-item.active .nav-link {
            background-color: #2d6a4f;
            color: white !important;
        }
        
        .baraka-brand {
            color: #00a550;
            font-weight: 800;
            margin-right: 15px;
        }
        
        .search-tabs {
            border-bottom: 1px solid #e5e7eb;
            margin-bottom: 20px;
        }
        
        .search-tabs .nav-link {
            color: #4b5563;
            border: none;
            border-bottom: 2px solid transparent;
            padding: 10px 20px;
            border-radius: 0;
        }
        
        .search-tabs .nav-link.active {
            color: #2d6a4f;
            border-bottom: 2px solid #2d6a4f;
            font-weight: 600;
        }
        
        .btn-search {
            background-color: #2d6a4f;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 15px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-search:hover {
            background-color: #1a4731;
        }
        
        .result-card {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #2d6a4f;
        }
        
        .copyright {
            text-align: center;
            margin-top: 30px;
            font-size: 14px;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="islamic-pattern islamic-pattern-left"></div>
    <div class="islamic-pattern islamic-pattern-right"></div>

    <div class="nav-container">
       
        <nav class="navbar navbar-expand-lg top-navbar">
            <h1 class="baraka-brand">Baraka</h1>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="/">Home</a>
                </li>
                <li class="nav-item active">
                    <a class="nav-link" href="/search">Search</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/favorites">Favorites</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/reciters">Reciters</a>
                </li>
            </ul>
        </nav>
    </div>

    <div class="main-container">
        <div class="container">
            <div class="search-wrapper">
                <h1 class="search-title" style="color: #00a550; font-weight: 800;">Search the Quran</h1>
                
                <ul class="nav nav-tabs search-tabs" id="searchTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <a class="nav-link active" id="surah-tab" data-toggle="tab" href="#surah" role="tab">Surah Search</a>
                    </li>
                    <li class="nav-item" role="presentation">
                        <a class="nav-link" id="ayah-tab" data-toggle="tab" href="#ayah" role="tab">Ayah Search</a>
                    </li>
                </ul>
                
                <div class="tab-content" id="searchTabsContent">
                    <div class="tab-pane fade show active" id="surah" role="tabpanel">
                        <form id="surah-search-form">
                            <div class="form-group">
                                <div class="input-group">
                                    <input type="text" id="surah-search-input" class="form-control" placeholder="Search for Surah by name..." dir="auto" th:value="${initialQuery}">
                                    <div class="input-group-append">
                                        <button type="submit" class="btn btn-search">
                                            <i class="fas fa-search"></i> Search
                                        </button>
                                    </div>
                                </div>
                                <small class="form-text text-muted">Enter Surah name in English or Arabic</small>
                            </div>
                        </form>
                        
                        <div id="surah-recents" class="mt-3 d-none">
                            <h5>Recent Searches:</h5>
                            <div class="recent-searches" id="surah-recent-searches"></div>
                        </div>
                        
                        <div id="surah-results" class="mt-4"></div>
                    </div>
                    
                    <div class="tab-pane fade" id="ayah" role="tabpanel">
                        <form id="ayah-search-form">
                            <div class="form-group">
                                <div class="input-group">
                                    <input type="text" id="ayah-search-input" class="form-control" placeholder="Search for Ayah by text..." dir="auto" th:value="${initialQuery}">
                                    <div class="input-group-append">
                                        <button type="submit" class="btn btn-search">
                                            <i class="fas fa-search"></i> Search
                                        </button>
                                    </div>
                                </div>
                                <small class="form-text text-muted">Enter Ayah text in English or Arabic</small>
                            </div>
                        </form>
                        
                        <div id="ayah-recents" class="mt-3 d-none">
                            <h5>Recent Searches:</h5>
                            <div class="recent-searches" id="ayah-recent-searches"></div>
                        </div>
                        
                        <div id="ayah-results" class="mt-4"></div>
                    </div>
                </div>
                
                <div class="copyright">
                    Baraka © 2025 - A Quran-centered experience
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/quran-search.js"></script>
    <script th:inline="javascript">
        $(document).ready(function() {
            // Check if we have an initial query from the server
            const initialQuery = /*[[${initialQuery}]]*/ null;
            if (initialQuery) {
                // Perform initial search if query was provided
                $('#surah-search-input').val(initialQuery);
                searchSurah(initialQuery);
            }
        });
    </script>
</body>
</html>
