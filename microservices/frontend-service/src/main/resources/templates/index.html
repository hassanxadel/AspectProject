<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran Search Service</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="/css/quran-search.css">
    <style>
        body {
            background-color: #f7f0dc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            background-image: none;
        }
        
        .islamic-pattern {
            position: fixed;
            height: 100%;
            width: 180px;
            background-image: url('assets/images/sides.png');
            background-repeat: repeat-y;
            z-index: -1;
        }
        
        .islamic-pattern-left {
            left: -20px;
        }
        
        .islamic-pattern-right {
            right: 0;
        }
        
        .search-wrapper {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 650px;
            margin: 0 auto;
            margin-top: 50px;
        }
        
        .search-title {
            color: #2d6a4f;
            text-align: center;
            margin-bottom: 25px;
            font-weight: 600;
            font-size: 32px;
        }
        
        .search-box {
            position: relative;
            margin-bottom: 20px;
        }
        
        .search-input {
            width: 100%;
            padding: 15px;
            padding-right: 50px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .search-input:focus {
            border-color: #2d6a4f;
            box-shadow: 0 0 0 3px rgba(45, 106, 79, 0.2);
            outline: none;
        }
        
        .search-button {
            position: absolute;
            right: 5px;
            top: 5px;
            background-color: #2d6a4f;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 15px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .search-button:hover {
            background-color: #1a4731;
        }
        
        .copyright {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #6b7280;
        }
        
        .navbar {
            background-color: transparent !important;
            box-shadow: none;
        }
        
        .navbar-brand {
            color: #2d6a4f !important;
            font-size: 24px;
            font-weight: bold;
            color: #00a550 !important;
            font-weight: 800;
        }
        
        .nav-link {
            color: #2d6a4f !important;
            font-weight: 500;
        }
        
        .main-container {
            min-height: calc(100vh - 150px);
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="islamic-pattern islamic-pattern-left"></div>
    <div class="islamic-pattern islamic-pattern-right"></div>

    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container">
            <a class="navbar-brand" href="/">Baraka</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item active">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/search">Search</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/favorites">Favorites</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/reciters">Reciters</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="container">
            <div class="search-wrapper">
                <h1 class="search-title" style="color: #00a550; font-weight: 800;">Search the Quran</h1>
                
                <form id="main-search-form">
                    <div class="search-box">
                        <input type="text" id="main-search-input" class="search-input" placeholder="Enter Surah name, Ayah, or keyword..." dir="auto">
                        <button type="submit" class="search-button">
                            <i class="fas fa-search"></i> Search
                        </button>
                    </div>
                </form>
                
                <div id="search-suggestions" class="suggestions-container" style="display: none;"></div>
                
                <div class="copyright">
                    Baraka © 2025 - A Quran-centered experience
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $(document).ready(function() {
            // Handle form submission
            $('#main-search-form').on('submit', function(e) {
                e.preventDefault();
                const keyword = $('#main-search-input').val().trim();
                
                if (keyword) {
                    // Redirect to search page with the keyword
                    window.location.href = `/search?q=${encodeURIComponent(keyword)}`;
                }
            });
            
            // Arabic text detection
            const arabicRegex = /[\u0600-\u06FF]/;
            
            // Set input direction based on text
            $('#main-search-input').on('input', function() {
                const input = $(this);
                const text = input.val();
                
                if (arabicRegex.test(text)) {
                    input.css('direction', 'rtl');
                    input.css('text-align', 'right');
                } else {
                    input.css('direction', 'ltr');
                    input.css('text-align', 'left');
                }
                
                // Get suggestions if 2+ characters entered
                if (text.length >= 2) {
                    $.ajax({
                        url: '/api/surahs/search',
                        method: 'GET',
                        data: { keyword: text },
                        success: function(response) {
                            showSuggestions(response.results);
                        }
                    });
                } else {
                    $('#search-suggestions').hide();
                }
            });
            
            function showSuggestions(results) {
                let suggestionsHtml = '';
                let suggestionsContainer = $('#search-suggestions');
                
                if (results && results.length > 0) {
                    results.slice(0, 5).forEach(item => {
                        const nameArabic = item.nameArabic || item.name || '';
                        const name = item.name || '';
                        
                        suggestionsHtml += `<div class="suggestion-item" data-value="${name}">${name} ${nameArabic ? `(${nameArabic})` : ''}</div>`;
                    });
                    
                    suggestionsContainer.html(suggestionsHtml);
                    suggestionsContainer.show();
                    
                    // Click handler for suggestion items
                    $('.suggestion-item').on('click', function() {
                        const value = $(this).data('value');
                        $('#main-search-input').val(value);
                        $('#search-suggestions').hide();
                        $('#main-search-form').submit();
                    });
                    
                } else {
                    suggestionsContainer.hide();
                }
            }
            
            // Hide suggestions when clicking outside
            $(document).on('click', function(e) {
                if (!$(e.target).closest('.suggestion-item, #main-search-input').length) {
                    $('#search-suggestions').hide();
                }
            });
        });
    </script>
</body>
</html>
