# Server configuration
server.port=8083

# Service discovery configuration for local development
surah.service.url=http://localhost:8081
ayah.service.url=http://localhost:8082
api.gateway.url=http://localhost:8080

# Thymeleaf configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Static resources
spring.resources.static-locations=classpath:/static/
spring.resources.cache.period=0
spring.resources.chain.enabled=false

# Devtools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Logging configuration
logging.level.root=INFO
logging.level.com.baraka=DEBUG

# Actuator endpoints for development
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

spring.application.name=frontend-service

# API URLs for microservices
api.surah-service.url=http://surah-service:8081/api/surahs
api.ayah-service.url=http://ayah-service:8082/api/ayahs

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info 