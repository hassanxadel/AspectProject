# Server configuration
server.port=8080

# Service routing configuration
spring.cloud.gateway.routes[0].id=surah-service
spring.cloud.gateway.routes[0].uri=${QURAN_SERVICE_URL:http://quran-service:8082}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/surahs/**

spring.cloud.gateway.routes[1].id=ayah-service
spring.cloud.gateway.routes[1].uri=${QURAN_SERVICE_URL:http://quran-service:8082}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/ayahs/**

spring.cloud.gateway.routes[2].id=frontend-service
spring.cloud.gateway.routes[2].uri=${FRONTEND_SERVICE_URL:http://frontend-service:8083}
spring.cloud.gateway.routes[2].predicates[0]=Path=/**

# Logging configuration for Docker
logging.level.root=INFO
logging.level.com.baraka=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Actuator endpoints for health checks
management.endpoints.web.exposure.include=health,info,metrics,gateway
management.endpoint.health.show-details=always

# CORS configuration
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=* 